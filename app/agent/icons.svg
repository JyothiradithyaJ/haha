import { useMemo, useState } from "react";
import { Link, useParams } from "react-router-dom";
import Layout from "../components/Layout";
import Button from "../components/Button";
import Tabs from "../components/Tabs";
import Modal from "../components/Modal";
import ResourceRow from "../components/ResourceCard";
import ContributeForm from "../components/ContributeForm";
import { departments, getCourse, getCourseResources } from "../data/mockData";
import type { ResourceType } from "../data/types";
import { RESOURCE_TYPE_LABEL } from "../data/types";

export default function Course() {
  const { id } = useParams();
  const course = getCourse(id ?? "");
  const [active, setActive] = useState<"all" | ResourceType>("all");
  const [uploadOpen, setUploadOpen] = useState(false);

  const resources = useMemo(() => getCourseResources(course?.id ?? ""), [course]);
  const filtered = active === "all" ? resources : resources.filter((r) => r.type === active);

  if (!course) {
    return (
      <Layout>
        <div className="mx-auto max-w-content px-5 py-24 text-center sm:px-8">
          <p className="text-ink-soft">Course not found.</p>
          <Link to="/" className="mt-4 inline-block text-oxblood">← Back to Archive</Link>
        </div>
      </Layout>
    );
  }

  const dept = departments.find((d) => d.id === course.departmentId);

  const tabs = [
    { id: "all", label: "All Files", count: resources.length },
    { id: "notes", label: "Notes", count: resources.filter((r) => r.type === "notes").length },
    { id: "past-paper", label: "Past Papers", count: resources.filter((r) => r.type === "past-paper").length },
    { id: "extras", label: "Extras", count: resources.filter((r) => r.type === "extras").length },
    { id: "reference", label: "References", count: resources.filter((r) => r.type === "reference").length },
  ];

  return (
    <Layout>
      <section className="border-b border-line px-5 py-12 sm:px-8 sm:py-14">
        <div className="mx-auto max-w-content">
          <p className="call-number">{dept?.name}</p>
          <div className="mt-3 flex flex-col justify-between gap-5 sm:flex-row sm:items-end">
            <h1 className="font-serif text-[30px] leading-tight text-ink sm:text-[36px]">
              {course.title}
            </h1>
            <Button onClick={() => setUploadOpen(true)} className="shrink-0">
              Upload a file to this course
            </Button>
          </div>
          <p className="mt-3 text-[14.5px] text-ink-soft">
            {resources.length} resources · organized by category
          </p>
        </div>
      </section>

      <section className="px-5 sm:px-8">
        <div className="mx-auto max-w-content">
          <Tabs items={tabs} active={active} onChange={(v) => setActive(v as typeof active)} />
          <div className="divide-y divide-line py-2">
            {filtered.map((r) => (
              <ResourceRow key={r.id} resource={r} />
            ))}
            {filtered.length === 0 && (
              <p className="py-16 text-center text-ink-faint">
                No {active !== "all" ? RESOURCE_TYPE_LABEL[active] : "resources"} uploaded yet
                for this course. Be the first to contribute.
              </p>
            )}
          </div>
        </div>
      </section>

      <Modal open={uploadOpen} onClose={() => setUploadOpen(false)} title="Share Course Resources">
        <p className="-mt-2 mb-4 text-[13.5px] text-ink-soft">
          Help fellow students by uploading past papers, lecture notes, or
          extras for {course.title}.
        </p>
        <ContributeForm compact defaultCourse={course.title} onSubmitted={() => setUploadOpen(false)} />
      </Modal>
    </Layout>
  );
}
